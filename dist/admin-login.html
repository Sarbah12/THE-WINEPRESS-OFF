<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <base href="/"/>
  <title>Admin Login — The Winepress</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Cinzel:wght@400;600;900&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --wine: #6B1A2A;
      --wine-mid: #8C2438;
      --wine-pale: #E8C8CE;
      --ink: #1C1010;
      --muted: #7A6060;
      --white: #FFFFFF;
      --off: #FAF8F5;
      --serif-d: 'DM Serif Display', Georgia, serif;
      --serif-c: 'Cinzel', serif;
      --sans: 'DM Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background:
        radial-gradient(circle at top left, rgba(176,80,104,.18), transparent 28%),
        radial-gradient(circle at bottom right, rgba(107,26,42,.14), transparent 32%),
        linear-gradient(180deg, #fff 0%, #faf3f0 100%);
      font-family: var(--sans);
      color: var(--ink);
    }

    .login-card {
      width: min(460px, 100%);
      background: rgba(255,255,255,.94);
      border: 1px solid rgba(107,26,42,.08);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(107,26,42,.12);
      padding: 2rem;
    }

    .eyebrow {
      font-family: var(--serif-c);
      font-size: .56rem;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--wine-mid);
      margin-bottom: 1rem;
    }

    h1 {
      font-family: var(--serif-d);
      font-size: 2.4rem;
      font-weight: 400;
      line-height: 1;
      margin-bottom: .8rem;
    }

    h1 em {
      display: block;
      font-style: italic;
      color: var(--wine);
    }

    p {
      color: var(--muted);
      line-height: 1.8;
      margin-bottom: 1.5rem;
    }

    form {
      display: grid;
      gap: 1rem;
    }

    label {
      display: grid;
      gap: .45rem;
      font-size: .75rem;
      color: var(--wine-mid);
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 600;
    }

    input {
      border: 1px solid rgba(107,26,42,.14);
      background: var(--off);
      border-radius: 14px;
      padding: .95rem 1rem;
      font: 400 .95rem var(--sans);
      color: var(--ink);
      outline: none;
    }

    input:focus {
      border-color: var(--wine);
      background: var(--white);
      box-shadow: 0 0 0 3px rgba(107,26,42,.08);
    }

    button {
      margin-top: .5rem;
      border: none;
      border-radius: 999px;
      background: var(--wine);
      color: var(--white);
      padding: 1rem 1.2rem;
      cursor: pointer;
      font: 600 .78rem var(--sans);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    #loginStatus {
      margin-top: 1rem;
      font-size: .86rem;
      color: var(--muted);
      min-height: 1.2rem;
    }

  </style>
</head>
<body>
  <section class="login-card">
    <div class="eyebrow">The Winepress</div>
    <h1>Admin <em>Access</em></h1>
    <p>The dashboard is now open directly. Continue to the backend dashboard below.</p>

    <form id="adminLoginForm">
      <button type="submit">Open Dashboard</button>
    </form>

    <div id="loginStatus"></div>
  </section>

  <script src="assets/js/admin-login.js"></script>
</body>
</html>
